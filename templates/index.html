<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcrição com Whisper</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --error: #dc2626;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 640px;
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
      color: var(--text);
    }

    p.subtitle {
      color: var(--text-muted);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    /* Área de Upload Personalizada */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      margin-bottom: 24px;
    }

    .upload-area:hover, .upload-area.dragover {
      border-color: var(--primary);
      background-color: #eff6ff;
    }

    .upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon { font-size: 2.5rem; margin-bottom: 12px; display: block; }
    .upload-text { font-weight: 600; color: var(--text); }
    .upload-hint { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
    .file-name { 
      margin-top: 12px; 
      font-size: 0.9rem; 
      color: var(--primary); 
      font-weight: 600;
      word-break: break-all;
    }

    /* Botão Principal */
    .btn-primary {
      width: 100%;
      padding: 14px 24px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary:hover:not(:disabled) { background-color: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

    /* Spinner de Carregamento */
    .spinner {
      width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Status e Resultados */
    #status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }
    #status.loading { display: block; background: #eff6ff; color: var(--primary); }
    #status.success { display: block; background: #f0fdf4; color: var(--success); }
    #status.error { display: block; background: #fef2f2; color: var(--error); }

    .result-section { margin-top: 24px; display: none; }
    .result-section.visible { display: block; }

    label.result-label { 
      display: block; 
      font-weight: 600; 
      margin-bottom: 8px; 
      font-size: 0.95rem; 
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: var(--primary); }

    .btn-download {
      margin-top: 12px;
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-download:hover { background: var(--bg); border-color: var(--text-muted); }

    @media (max-width: 480px) {
      .container { padding: 24px; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎙️ Transcrição com Whisper</h1>
    <p class="subtitle">Envie um vídeo MP4 ou arquivo de áudio e obtenha a transcrição completa em texto.</p>

    <!-- Upload Area -->
    <div class="upload-area" id="uploadArea">
      <input type="file" id="arquivoInput" accept="video/mp4,audio/*">
      <span class="upload-icon">📁</span>
      <div class="upload-text">Clique ou arraste seu arquivo aqui</div>
      <div class="upload-hint">Suporta MP4, MP3, WAV, M4A e outros formatos</div>
      <div class="file-name" id="fileName"></div>
    </div>

    <!-- Botão de Ação -->
    <button class="btn-primary" id="btnTranscrever" onclick="enviarArquivo()">
      <span class="spinner" id="spinner"></span>
      <span id="btnText">Transcrever Arquivo</span>
    </button>

    <!-- Feedback de Status -->
    <div id="status"></div>

    <!-- Resultado -->
    <div class="result-section" id="resultSection">
      <label class="result-label" for="resultadoText">Transcrição:</label>
      <textarea id="resultadoText" placeholder="A transcrição aparecerá aqui..."></textarea>
      <button class="btn-download" id="btnBaixar" onclick="baixarTxt()">⬇ Baixar .TXT</button>
    </div>
  </div>

  <script>
    // Preview do nome do arquivo e drag-and-drop visual
    const fileInput = document.getElementById('arquivoInput');
    const fileNameDisplay = document.getElementById('fileName');
    const uploadArea = document.getElementById('uploadArea');

    fileInput.addEventListener('change', () => {
      fileNameDisplay.textContent = fileInput.files[0] ? `✅ ${fileInput.files[0].name}` : '';
    });

    ['dragenter', 'dragover'].forEach(evt => {
      uploadArea.addEventListener(evt, (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(evt => {
      uploadArea.addEventListener(evt, (e) => { e.preventDefault(); uploadArea.classList.remove('dragover'); });
    });

    async function enviarArquivo() {
      const statusDiv = document.getElementById('status');
      const resultadoText = document.getElementById('resultadoText');
      const btnBaixar = document.getElementById('btnBaixar');
      const resultSection = document.getElementById('resultSection');
      const btnTranscrever = document.getElementById('btnTranscrever');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');

      if (!fileInput.files[0]) {
        setStatus('Selecione um arquivo MP4 ou de áudio primeiro!', 'error');
        return;
      }

      const formData = new FormData();
      formData.append('arquivo', fileInput.files[0]);

      // Estado de loading
      btnTranscrever.disabled = true;
      spinner.style.display = 'block';
      btnText.textContent = 'Transcrevendo...';
      setStatus('Processando seu arquivo... Isso pode levar alguns segundos.', 'loading');
      resultadoText.value = '';
      resultSection.classList.remove('visible');

      try {
        const response = await fetch('/transcrever', { method: 'POST', body: formData });
        const data = await response.json();

        if (response.ok) {
          setStatus('Transcrição concluída com sucesso!', 'success');
          resultadoText.value = data.texto;
          resultSection.classList.add('visible');
        } else {
          setStatus('Erro: ' + data.erro, 'error');
        }
      } catch (err) {
        setStatus('Erro ao conectar com o servidor. Verifique se o Flask está rodando.', 'error');
      } finally {
        btnTranscrever.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Transcrever Arquivo';
      }
    }

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = type;
    }

    function baixarTxt() {
      const texto = document.getElementById('resultadoText').value;
      if (!texto) return;
      const blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'transcricao.txt';
      a.click();
      URL.revokeObjectURL(a.href);
    }
  </script>
</body>
</html>
